<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="isify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0b0d14" />
  <g filter="url(#glow)">
    <!-- Stylized 'I' with soundwaves -->
    <rect x="9" y="18" width="4" height="12" rx="2" fill="url(#isify-grad)" opacity="0.75" />
    <rect x="16" y="11" width="4" height="26" rx="2" fill="url(#isify-grad)" />
    <rect x="23" y="6" width="4" height="36" rx="2" fill="#1ed760" />
    <rect x="30" y="14" width="4" height="20" rx="2" fill="url(#isify-grad)" />
    <rect x="37" y="20" width="4" height="8" rx="2" fill="url(#isify-grad)" opacity="0.6" />
  </g>
</svg>